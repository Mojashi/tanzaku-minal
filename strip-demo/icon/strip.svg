<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS Big Sur sized squircle: 824x824 centred in a 1024 canvas -->
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#171a1f"/>
      <stop offset="60%"  stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a5462"/>
      <stop offset="100%" stop-color="#333b46"/>
    </linearGradient>

    <linearGradient id="colActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5d6878"/>
      <stop offset="100%" stop-color="#414b58"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffc44d"/>
      <stop offset="100%" stop-color="#ef9c11"/>
    </linearGradient>

    <!-- the strip runs off the right edge, so the cut column falls away -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#060709" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060709" stop-opacity="0.62"/>
    </linearGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- Columns of equal, fixed width. The point of the layout is that they do
         not shrink: the strip simply continues past the right edge. -->

    <!-- column 3 and 4 first, so nearer columns overlap them -->
    <!-- column 4: cut by the edge of the icon -->
    <rect x="806" y="228" width="196" height="566" rx="30" fill="url(#col)" opacity="0.72"/>
    <rect x="806" y="228" width="196" height="62"  rx="30" fill="#68748a" opacity="0.72"/>
    <rect x="806" y="260" width="196" height="30"           fill="#68748a" opacity="0.72"/>

    <!-- column 3 -->
    <rect x="588" y="228" width="196" height="566" rx="30" fill="url(#col)" opacity="0.86"/>
    <rect x="588" y="228" width="196" height="62"  rx="30" fill="#68748a" opacity="0.86"/>
    <rect x="588" y="260" width="196" height="30"           fill="#68748a" opacity="0.86"/>
    <rect x="622" y="336" width="112" height="18" rx="9" fill="#0d0f12" opacity="0.5"/>
    <rect x="622" y="386" width="72"  height="18" rx="9" fill="#0d0f12" opacity="0.5"/>

    <!-- column 2 -->
    <rect x="370" y="228" width="196" height="566" rx="30" fill="url(#col)"/>
    <rect x="370" y="228" width="196" height="62"  rx="30" fill="#7d8a9e"/>
    <rect x="370" y="260" width="196" height="30"           fill="#7d8a9e"/>
    <rect x="404" y="336" width="128" height="18" rx="9" fill="#0d0f12" opacity="0.55"/>
    <rect x="404" y="386" width="84"  height="18" rx="9" fill="#0d0f12" opacity="0.55"/>
    <rect x="404" y="436" width="108" height="18" rx="9" fill="#0d0f12" opacity="0.4"/>

    <!-- column 1: the active one -->
    <rect x="152" y="228" width="196" height="566" rx="30" fill="url(#colActive)"/>
    <rect x="152" y="228" width="196" height="62"  rx="30" fill="url(#amber)"/>
    <rect x="152" y="260" width="196" height="30"           fill="url(#amber)"/>
    <rect x="186" y="336" width="86"  height="18" rx="9" fill="#a6e22e"/>
    <rect x="186" y="386" width="128" height="18" rx="9" fill="#0d0f12" opacity="0.55"/>
    <rect x="186" y="436" width="72"  height="18" rx="9" fill="#0d0f12" opacity="0.55"/>
    <rect x="186" y="486" width="104" height="18" rx="9" fill="#0d0f12" opacity="0.38"/>

    <!-- darken towards the cut edge -->
    <rect x="700" y="100" width="224" height="824" fill="url(#fade)"/>

    <!-- horizontal scroll indicator -->
    <rect x="152" y="840" width="632" height="20" rx="10" fill="#ffffff" opacity="0.10"/>
    <rect x="152" y="840" width="292" height="20" rx="10" fill="#ffc44d" opacity="0.85"/>
  </g>

  <!-- inner rim light, keeps the squircle crisp on dark backgrounds -->
  <rect x="102.5" y="102.5" width="819" height="819" rx="183" ry="183"
        fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="5"/>
</svg>
