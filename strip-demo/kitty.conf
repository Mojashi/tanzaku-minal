# strip layout demo — 普段の Ghostty に寄せた設定
#
# 短冊レイアウト: 各カラムに最小幅(桁)の床を設け、収まらなくなったら
# 縮めずに横スクロールする。

enabled_layouts strip:min_columns=40;sidebar=yes


# ============================================================================
# 見た目 — Ghostty の設定から移植
# ============================================================================

# Ghostty が使っているのと同じ JetBrains Mono。Ghostty はこれをバイナリに同梱していて
# システムには入らないので、brew install --cask font-jetbrains-mono で別途入れてある。
# ghostty: font-style-bold/italic = false なので bold/italic も同じ face にする。
font_family      JetBrains Mono
bold_font        JetBrains Mono
italic_font      JetBrains Mono
bold_italic_font JetBrains Mono
font_size 13

# ghostty: adjust-cell-height = 2 (行間). 行送りは好みなので残す。
modify_font cell_height 2px

# ghostty: adjust-cell-width = -1 は移植しない。
#   Ghostty はセルを詰めたうえでグリフを中央に置き直すが、kitty の modify_font
#   cell_width はセルを狭めるだけなので字間が詰まって不揃いに見える。
#   試すなら以下を有効化する:
# modify_font cell_width -1px

# ghostty の font-thicken = true に相当するもの。kitty の既定 (macOS で gamma 1.7 /
#   contrast 30) は暗背景だと細く見える。2 つ目の数字が「明るい字を暗背景に置いたとき
#   の太さ」を決めるので、そこだけ上げてある。細すぎ/太すぎならこの数字を動かす。
text_composition_strategy 1.7 45

# ghostty: theme = Smyck
background            #1b1b1b
foreground            #f7f7f7
selection_foreground  #f7f7f7
selection_background  #207483
cursor                #f7f7f7
cursor_text_color     background

color0  #000000
color1  #b84131
color2  #7da900
color3  #c4a500
color4  #62a3c4
color5  #ba8acc
color6  #207383
color7  #a1a1a1
color8  #7a7a7a
color9  #d6837c
color10 #c4f137
color11 #fee14d
color12 #8dcff0
color13 #f79aff
color14 #6ad9cf
color15 #f7f7f7

background_opacity 0.8

# ghostty: window-padding-x/y = 2
window_padding_width 2

# ghostty: term = xterm-256color
term xterm-256color

# ログインシェル (dscl の UserShell) を明示的に指定する。
# 親プロセスの $SHELL を継承させると、起動元によって別のシェルになってしまう。
shell /bin/zsh

# ghostty: scrollback-limit / copy-on-select / cursor-style / mouse-hide の既定に合わせる
scrollback_lines 100000
copy_on_select yes
cursor_shape block
# ghostty: mouse-hide-while-typing = false (kitty は別機構なので 0 = 隠さない)
mouse_hide_wait 0

# ghostty の split divider に相当
window_border_width 1pt
active_border_color #f0a020
inactive_border_color #3a3a3a
draw_minimal_borders yes

# 境界線を掴める範囲 (pt)。既定 2 は 1pt の線に対して狭い。
# Ghostty も同じ問題を抱えていて discussion #12197 で 10〜12 が要望されている。
window_drag_tolerance 8

# 各カラムの上にタイトル帯を出す (1 = 常に表示)
window_title_bar top
window_title_bar_min_windows 1
window_title_bar_active_foreground   #1b1b1b
window_title_bar_active_background   #f0a020
window_title_bar_inactive_foreground #a1a1a1
window_title_bar_inactive_background #2a2a2a
window_title_template "{bell_symbol}{activity_symbol}{title}"

# 常用するので既定 (-1 = カラムが複数あるときは確認) に戻す。
# デモ中に一括で殺したいときだけ 0 にする。
confirm_os_window_close -1


# ============================================================================
# キーバインド — Ghostty の split 系をそのまま移植
# ============================================================================
# kitty の既定 (ctrl+shift+...) はそのまま残してあるので、両方使える。

# ghostty: super+d = new_split:right
#   Ghostty は split-inherit-working-directory が既定 true なので、それに合わせて
#   カレントディレクトリを引き継ぎ、かつ現在のカラムの「右隣」に作る。
#   (kitty の new_window はどちらもしない)
map cmd+d                launch --cwd=current --location=after

# ghostty: super+[ / ] = goto_split:previous / next
map cmd+[                previous_window
map cmd+]                next_window

# ghostty: super+alt+arrow_left / right = goto_split:left / right
map cmd+alt+left         neighboring_window left
map cmd+alt+right        neighboring_window right

# ghostty: super+ctrl+arrow_left / right = resize_split
#   短冊ではこれが「このカラムだけ広げる = 全体が伸びる」になる
map cmd+ctrl+left        resize_window narrower 2
map cmd+ctrl+right       resize_window wider 2

# ghostty: super+ctrl+= = equalize_splits
map cmd+ctrl+equal       layout_action equalize

# ghostty: super+shift+enter = toggle_split_zoom
map cmd+shift+enter      toggle_layout stack

# ghostty: super+w = close_surface (ペインを閉じる)
#   kitty 既定の cmd+w は close_tab なので上書きする
map cmd+w                close_window
# ghostty: super+alt+w = close_tab:this
map cmd+alt+w            close_tab
# ghostty: super+shift+w = close_window (OS ウィンドウごと) は kitty 既定と同じなので触らない

# カラムを独立させる (Ghostty には対応物が無い。detach_split は PR #13527 で未マージ)
#   cmd+n / cmd+t は kitty 既定で新規 OS ウィンドウ / 新規タブなので shift 付きに置く
map cmd+shift+n          detach_window new
map cmd+shift+t          detach_window new-tab
# 行き先を選びたいとき (既存のタブ / 新規タブ / 新規 OS ウィンドウ から選択)
map cmd+ctrl+shift+n     detach_window ask

# kitty 既定の cmd+shift+d は close_window。Ghostty では new_split:down なので、
# 縦分割のつもりで押してペインが消える事故を防ぐために外す
map cmd+shift+d          no_op

# 閉じたカラムを開き直す。cwd と動いていたプログラムが戻り、claude は --continue が
# 付くので直前の会話が復元される。kitty 既定の cmd+t (新規タブ) を潰すが、
# 新規タブは ctrl+shift+t に残っている。
map cmd+t                reopen_closed_window

# セッション一覧は enabled_layouts の sidebar=yes で常時出る。これで消したり戻したり。
#   strip_sidebar が付いた窓はスクロールせず右端にドックされる。おかげで
#   最後のスクロール列の右には必ず境界線ができ、掴んで広げられるようになる。
map cmd+shift+s          layout_action sidebar
# 読むとき用に一時的に広げて、もう一度で元の幅へ戻す。
# 細かい調整は左端のドラッグか、サイドバーにフォーカスして cmd+ctrl+←→。
map cmd+shift+backslash  layout_action sidebar_width toggle

# 選択したパスをプレビューする。画像は icat、それ以外はページャ。
# 存在するファイルのパスでなければ何も起きないので、下の自動発火も静かなまま。
map cmd+shift+p          preview_selection
preview_on_select yes

# ghostty: keybind = shift+enter=text:\n
map shift+enter          send_text all \n

# ghostty: keybind = super+backspace=text:\x15
#   macOS の「行頭まで削除」を ctrl+u として送る。kitty に既定は無い。
map cmd+backspace        send_text all \x15

# 既定の no だと Option はユニコード入力用に食われ、kitty のドキュメントいわく
# "This will break any Alt+Key keyboard shortcuts in your terminal programs" —
# つまり option+backspace (単語削除) がシェルでも効かない。左 Option だけ Alt に
# 回し、右 Option は ¥ などのユニコード入力に残す。
# (この設定は設定リロードでは反映されず、再起動が要る)
macos_option_as_alt left

# リンクを cmd+click で開く。kitty 既定は素のクリックだが、tmux や TUI が
# マウスを grab している間はアプリにイベントが行くので開けない (既定の逃げ道は
# ctrl+shift+click)。macOS の作法に合わせて cmd を足す。
# キーボードだけで開くなら ctrl+shift+e (open_url_with_hints, kitty 既定)。
mouse_map cmd+left       release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left       press grabbed discard_event

# --- 短冊レイアウト固有 (Ghostty に対応物が無いもの) ---
map cmd+shift+left       layout_action scroll -1
map cmd+shift+right      layout_action scroll 1
# 上が効かない環境向けの別名 (kitty 既定のタブ切替を潰すが、短冊では 1 タブ運用のため)
map ctrl+shift+left      layout_action scroll -1
map ctrl+shift+right     layout_action scroll 1
map cmd+shift+period     layout_action resize_all 10
map cmd+shift+comma      layout_action resize_all -10
map cmd+shift+0          layout_action fit

# 最小幅 (桁) をその場で上下する。全カラムが新しい最小幅に揃うので変化が即座に見える。
map cmd+shift+minus      layout_action min_columns -10
map cmd+shift+equal      layout_action min_columns +10


# ============================================================================
# 操作しやすさのため (デモ用)
# ============================================================================
allow_remote_control yes
listen_on unix:/tmp/kitty-strip-test

# 移植しなかったもの:
#   ghostty: font-feature = -dlig       … dlig はコーディングフォントではほぼ無効果
#   ghostty: font-thicken = true          … text_composition_strategy で近似した (上部参照)
#   ghostty: alpha-blending = linear    … kitty に対応オプション無し。background_opacity 0.8
#                                         と併用したときの字の見え方が最後まで一致しない要因
#   ghostty: shell-integration-features = sudo … kitty の shell_integration とは別物
#   ghostty: super+shift+d = new_split:down   … strip に縦分割は無い (下記)
